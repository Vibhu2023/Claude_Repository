name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: "30 4 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily status report
        run: python daily_status_update.py

      - name: Commit and push DAILY_STATUS.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS.md
          # Only commit if the file actually changed
          git diff --cached --quiet && echo "No changes — skipping commit" || \
            git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d 10:00 IST')"
          git push origin HEAD

name: Daily Hiring Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  update-pipeline-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily status report
        run: python daily_update.py

      - name: Commit and push if report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_PIPELINE_STATUS.md
          if git diff --staged --quiet; then
            echo "No changes to pipeline status."
          else
            git commit -m "chore: daily pipeline status update $(date -u +'%Y-%m-%d')"
            git push
          fi

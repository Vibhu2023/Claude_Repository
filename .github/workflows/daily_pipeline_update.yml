name: Daily Pipeline Status Update

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST (UTC+5:30)
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/vigilant-ritchie-AyMlG

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily pipeline status
        run: python generate_daily_status.py

      - name: Commit and push if report changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily pipeline status $(date +'%Y-%m-%d')"
            git push origin claude/vigilant-ritchie-AyMlG
          fi

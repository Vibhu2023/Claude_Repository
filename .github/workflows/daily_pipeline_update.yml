name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual run

permissions:
  contents: write

jobs:
  update-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/vigilant-ritchie-SUwzv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily pipeline report
        run: python pipeline_tracker.py

      - name: Commit and push updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HIRING_PIPELINE_REPORT.md candidates_data.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d 10:00 IST')"
          git push origin claude/vigilant-ritchie-SUwzv

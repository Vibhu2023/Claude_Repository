name: Daily Pipeline Status Update

on:
  schedule:
    # 4:30 AM UTC = 10:00 AM IST (UTC+5:30)
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily status report
        run: python daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily pipeline status update $(date -u +'%Y-%m-%d')"
            git push
          fi

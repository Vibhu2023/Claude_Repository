name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  pipeline-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pipeline status report
        run: python daily_pipeline_update.py

      - name: Commit daily report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ="Asia/Kolkata" date +"%Y-%m-%d")
          git add pipeline_reports/
          git diff --cached --quiet || git commit -m "chore: daily pipeline status report ${DATE} 10:00 AM IST"
          git push

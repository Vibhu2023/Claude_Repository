name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:  # allow manual trigger for testing

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pipeline status report
        run: python pipeline_status.py --save

      - name: Commit and push updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to DAILY_STATUS.md — skipping commit"
          else
            git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d')"
            git push
          fi

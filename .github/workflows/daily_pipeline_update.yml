name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  update-pipeline-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily pipeline status
        run: python pipeline_status.py DAILY_PIPELINE_STATUS.md

      - name: Commit and push status update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_PIPELINE_STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily pipeline status update $(date -u +'%Y-%m-%d')"
            git push
          fi

name: Daily Candidate Pipeline Status

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

jobs:
  generate-daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily status report
        run: python daily_status.py

      - name: Commit and push report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions [Daily Pipeline Bot]"
          git add DAILY_STATUS_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d')"
            git push
          fi

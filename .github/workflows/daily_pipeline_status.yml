name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pipeline-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/vigilant-ritchie-49gidb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily pipeline status
        run: python pipeline_daily_update.py

      - name: Commit and push updated status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_PIPELINE_STATUS.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily pipeline status update $(date -u +'%Y-%m-%d')"
          git push origin claude/vigilant-ritchie-49gidb

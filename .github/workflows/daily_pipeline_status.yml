name: Daily Pipeline Status Update

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily status
        run: python daily_status.py

      - name: Commit and push status files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS.md STATUS_LOG.md
          git diff --cached --quiet || git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d') [skip ci]"
          git push

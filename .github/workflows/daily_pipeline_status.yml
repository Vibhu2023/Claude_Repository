name: Daily Pipeline Status Update

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST every day
    - cron: '30 4 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/vigilant-ritchie-jysmjo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily status report
        run: python generate_daily_status.py

      - name: Commit and push updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_STATUS_UPDATE.md
          git diff --cached --quiet || git commit -m "chore: daily pipeline status update $(date +'%Y-%m-%d')"
          git push origin claude/vigilant-ritchie-jysmjo
